name: Zidane Wallet Security Tests

on:
  push:
    branches:
      - v3-wallet-foundation
  pull_request:
    branches:
      - v3-wallet-foundation

jobs:
  test:
    name: Run Wallet Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run security tests
        run: npm test